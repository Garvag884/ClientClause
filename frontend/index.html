<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClientClause</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:30px auto;padding:0 16px;color:#222}
textarea{width:100%;height:110px;padding:10px;font-size:15px;box-sizing:border-box}
button{padding:9px 16px;font-size:15px;cursor:pointer;margin-top:8px}
.card{border:1px solid #ddd;border-radius:8px;padding:14px;margin:14px 0}
.error{color:#b00020}.warn{color:#9a6700}.ok{color:#1a7f37}
label{display:block;font-size:13px;margin-top:8px}
input{width:100%;padding:6px;font-size:14px;box-sizing:border-box}
select{margin-left:8px}
.note{font-size:13px;color:#666}
.contract{font-family:Georgia,"Times New Roman",serif;line-height:1.55;font-size:15px}
.print-logo{display:none}
.contract mark{color:inherit;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.contract mark.key-detail{background:#fff2bf;border-bottom:1px solid #c79827;padding:0 1px}
.contract mark.missing{background:#ffe0d9;border-bottom:2px solid #c43b24;color:#8e2012;font-weight:bold;padding:0 2px}
.contract mark.missing[data-field]{cursor:pointer}
.contract mark.missing[data-field]:focus{outline:2px solid #8e2012;outline-offset:2px}
.report-link{border:0;background:none;color:inherit;font:inherit;text-align:left;padding:0;text-decoration:underline;text-decoration-style:dotted;cursor:pointer}
.contract h2{text-align:center;letter-spacing:1px}
.pre{margin:8px 0;white-space:pre-wrap}
.clause{margin:14px 0}
.ctext{white-space:pre-wrap;margin-top:4px;text-align:justify}
.sigblock{margin-top:28px;break-inside:avoid}
.sigrow{display:flex;gap:28px;margin:16px 0;flex-wrap:wrap}
.sigcol{flex:1;min-width:220px;font-size:14px;line-height:1.9}
.line{border-bottom:1px solid #000;height:46px;margin-bottom:4px}
@media print{.noprint{display:none}.card{border:none;padding:0}body{margin:0 auto}.contract{position:relative}.print-logo{display:block;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:110mm;height:auto;max-height:145mm;object-fit:contain;opacity:.08;z-index:0;pointer-events:none}.contract>*:not(.print-logo){position:relative;z-index:1}}
</style>
</head>
<body>
<div class="noprint">
<h1>ClientClause</h1>
<p>Describe any agreement in plain language. Currently supported: freelance agreements, NDAs and employment agreements.</p>
<textarea id="desc" placeholder="Example: I'm Riya Sharma, a web developer. I'm building a website for Acme Traders for 50,000 rupees from 1 December 2026 to 31 January 2027. Courts in Bengaluru."></textarea>
<button onclick="draft()">Draft contract</button>
<div id="status"></div>
</div>
<div id="out"></div>
<p class="note noprint">This is a drafting aid, not legal advice. Stamp duty, registration and leave rules vary by state, so have a lawyer review any contract before signing.</p>
<script>
let state = null;
const $ = id => document.getElementById(id);
function esc(s){return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function importantValue(f){
  const v = state.fields[f.key];
  if(v == null || String(v).trim() === "") return "";
  if(f.type === "date"){
    const d = new Date(String(v) + "T00:00:00");
    return Number.isNaN(d.getTime()) ? String(v) : new Intl.DateTimeFormat("en-GB", {day:"numeric", month:"long", year:"numeric"}).format(d);
  }
  if(f.type === "number"){
    const n = Number(v);
    if(!Number.isFinite(n)) return String(v);
    if(f.money){
      const rounded = Math.round(n * 100) / 100;
      const whole = Math.trunc(rounded);
      const paise = Math.round((rounded - whole) * 100);
      return new Intl.NumberFormat("en-IN", {maximumFractionDigits:0}).format(whole) + (paise ? "." + String(paise).padStart(2,"0") : "/-");
    }
    return Number.isInteger(n) ? String(n) : String(n);
  }
  return String(v).trim();
}
function contractText(value){
  const details = state.field_defs
    .filter(f => f.required || f.type === "date" || f.type === "number" || /name/.test(f.key))
    .map(importantValue).filter(v => v.length >= 2);
  const alternatives = [...new Set(details)].sort((a,b) => b.length-a.length).map(v => {
    const escaped = v.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return /^\d+(?:[.,]\d+)?$/.test(v) ? "(?<![0-9])" + escaped + "(?![0-9])" : "(?<![\\p{L}\\p{N}])" + escaped + "(?![\\p{L}\\p{N}])";
  });
  const missing = "(\\[[a-z0-9_ ]+\\?\\])";
  const pattern = new RegExp(alternatives.length ? "(" + alternatives.join("|") + ")|" + missing : missing, "giu");
  return String(value ?? "").replace(pattern, match => {
    if(match.startsWith("[")){
      const key = match.slice(1,-2).trim().replace(/\s+/g,"_");
      const field = state.field_defs.find(f => f.key.toLowerCase() === key.toLowerCase());
      const attrs = field ? ` data-field="${esc(field.key)}" role="button" tabindex="0" title="Go to ${esc(field.label)}"` : "";
      return `<mark class="missing"${attrs}>${esc(match)}</mark>`;
    }
    return `<mark class="key-detail">${esc(match)}</mark>`;
  });
}
function focusField(key){
  const field = $("f_" + key);
  if(!field) return;
  field.scrollIntoView({behavior:"smooth",block:"center"});
  field.focus({preventScroll:true});
}
async function post(url, body){
  const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const d = await r.json();
  if(!r.ok) throw new Error(d.detail || "Something went wrong");
  return d;
}
async function draft(){
  $("status").textContent = "Working...";
  try{
    state = await post("/api/draft", {text: $("desc").value});
    state.variants = {};
    $("status").textContent = "";
    render();
  }catch(e){ $("status").textContent = e.message; }
}
async function rebuild(){
  state.field_defs.forEach(f => { const el = $("f_" + f.key); if(el) state.fields[f.key] = el.value.trim(); });
  try{
    const d = await post("/api/build", {type_id: state.type_id, fields: state.fields, variants: state.variants});
    state = {...state, ...d};
    render();
  }catch(e){ $("status").textContent = e.message; }
}
function setVar(id, v){ state.variants[id] = v; rebuild(); }
function label(o){ return o === "a" ? "Favours " + state.side_a : o === "b" ? "Favours " + state.side_b : "Balanced"; }
function render(){
  const s = state;
  let h = `<div class="card noprint"><h2>${esc(s.type_name)}</h2><p>Check and complete the details:</p>`;
  s.field_defs.forEach(f => {
    h += `<label for="f_${esc(f.key)}">${esc(f.label)}${f.required ? " *" : ""}</label><input id="f_${esc(f.key)}" value="${esc(s.fields[f.key] || "")}">`;
  });
  h += `<button onclick="rebuild()">Update contract</button></div>`;
  h += `<div class="card noprint"><h3>Reliability report</h3>` +
       s.report.map(r => {
         const missing = r.level === "error" ? s.field_defs.find(f => r.message === "Missing detail: " + f.label) : null;
         const message = missing
           ? `<button type="button" class="report-link" data-field="${esc(missing.key)}">${esc(r.message)}</button>`
           : esc(r.message);
         return `<div class="${r.level}">${r.level==="ok"?"✔":r.level==="error"?"✖":"⚠"} ${message}</div>`;
       }).join("") + `</div>`;
  h += `<div class="card contract"><img class="print-logo" src="/logo.png" alt="ClientClause logo"><h2>${esc(s.type_name.toUpperCase())}</h2>`;
  s.preamble.forEach(p => { h += `<div class="pre">${contractText(p)}</div>`; });
  s.clauses.forEach(c => {
    const opts = c.options.length > 1
      ? `<select class="noprint" onchange="setVar('${c.id}', this.value)">` +
        c.options.map(o => `<option value="${o}" ${o===c.variant?"selected":""}>${esc(label(o))}</option>`).join("") + `</select>`
      : "";
    h += `<div class="clause"><b>${c.number}. ${esc(c.title)}</b>${opts}<div class="ctext">${contractText(c.text)}</div></div>`;
  });
  const g = s.signature;
  h += `<div class="sigblock"><p>${esc(g.closing)}</p><div class="sigrow">` +
    g.parties.map(p => `<div class="sigcol"><b>Signed by the ${esc(p.role)}</b><div class="line"></div><div>Name: ${contractText(p.name)}</div><div>Date: ${contractText(g.date)}</div><div>Place: ${contractText(g.place)}</div></div>`).join("") +
    `</div>`;
  if(g.witnesses){
    h += `<p><b>Witnesses:</b></p><div class="sigrow">` +
      Array.from({length: g.witnesses}, (_, i) => `<div class="sigcol"><b>Witness ${i+1}</b><div class="line"></div><div>Name: ____________________</div><div>Address: __________________</div></div>`).join("") +
      `</div>`;
  }
  h += `</div><p class="noprint"><button onclick="window.print()">Print / Save as PDF</button></p></div>`;
  $("out").innerHTML = h;
  $("out").querySelectorAll("[data-field]").forEach(el => {
    el.addEventListener("click", () => focusField(el.dataset.field));
    if(el.matches("mark")) el.addEventListener("keydown", event => {
      if(event.key === "Enter" || event.key === " "){
        event.preventDefault();
        focusField(el.dataset.field);
      }
    });
  });
}
</script>
</body>
</html>
